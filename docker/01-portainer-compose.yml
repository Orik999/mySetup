# 01-portainer-compose.yml
# Project: Portainer
# Purpose: Docker management UI through socket-proxy and Traefik.
# Bootstrap note: script 6.5 may add a local override exposing 9443 temporarily.
# Production note: keep direct ports removed and access through Traefik/AuthentiK.

name: portainer

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -H tcp://socket-proxy:2375
    networks:
      - t2_proxy
      - socket_proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_DIR}/appdata/portainer:/data
    environment:
      TZ: ${TZ}
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`portainer.${DOMAIN}`)
      traefik.http.routers.portainer.entrypoints: https
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.tls.certresolver: cloudflare
      traefik.http.routers.portainer.middlewares: chain-authentik@file
      traefik.http.routers.portainer.service: portainer
      traefik.http.services.portainer.loadbalancer.server.port: 9000

networks:
  t2_proxy:
    name: t2_proxy
    external: true
  socket_proxy:
    name: socket_proxy
    external: true
