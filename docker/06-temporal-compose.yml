# 06-temporal-compose.yml
# Project: Temporal
# Purpose: Temporal backend service for Postiz/background workflows.
# Note: no dynamicconfig host mount by default, so the image built-in config is not hidden.

name: temporal

services:
  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 workflow list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  database:
    name: database
    external: true
