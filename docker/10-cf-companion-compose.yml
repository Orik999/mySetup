# 09-cf-companion-compose.yml
# Project: Traefik Cloudflare Companion
# Purpose: Automatically creates/updates Cloudflare DNS records from Traefik Docker labels.
#
# Public-GitHub-safe:
# - No Cloudflare token is stored in this file.
# - Script 6 writes the real token to ${CF_API_TOKEN_FILE}.
# - Docker mounts it as /run/secrets/cf_api_token.
# - The entrypoint reads the secret file and exports:
#     CF_API_TOKEN
#     CLOUDFLARE_API_TOKEN
# - This avoids relying on unsupported *_FILE environment syntax.
#
# Notes:
# - Docker label discovery is enabled through socket-proxy.
# - Traefik polling is intentionally disabled because Docker label discovery is sufficient
#   for this stack and avoids needing to expose/query the Traefik API URL.
# - If future testing shows polling is required, set ENABLE_TRAEFIK_POLL=true and add
#   the correct TRAEFIK_URL for the internal Traefik endpoint.

name: cf-companion

secrets:
  cf_api_token:
    file: ${CF_API_TOKEN_FILE}

services:
  cf-companion:
    env_file:
      - /home/orik/docker/.env
    image: tiredofit/traefik-cloudflare-companion:latest
    container_name: cf-companion
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    networks:
      - socket_proxy

    secrets:
      - cf_api_token

    environment:
      # Timezone.
      TIMEZONE: ${TZ}

      # Docker provider discovery through socket proxy.
      DOCKER_HOST: tcp://socket-proxy:2375

      # Traefik label discovery mode.
      TRAEFIK_VERSION: 2
      ENABLE_TRAEFIK_POLL: "FALSE"

      # Cloudflare zone/domain mapping.
      TARGET_DOMAIN: ${DOMAIN}
      DOMAIN1: ${DOMAIN}
      DOMAIN1_ZONE_ID: ${CF_ZONE_ID}
      DOMAIN1_PROXIED: "true"
      DEFAULT_TTL: 1

      # Non-secret Cloudflare account metadata.
      CF_API_EMAIL: ${CF_API_EMAIL}

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        if [ ! -s /run/secrets/cf_api_token ]; then
          echo "ERROR: Cloudflare token secret is missing or empty: /run/secrets/cf_api_token" >&2
          exit 1
        fi

        export CF_API_TOKEN="$(cat /run/secrets/cf_api_token)"
        export CLOUDFLARE_API_TOKEN="${CF_API_TOKEN}"

        exec /init

networks:
  socket_proxy:
    name: socket_proxy
    external: true
