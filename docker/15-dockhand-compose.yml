# 15-dockhand-compose.yml
# Project: Dockhand
# Purpose: Modern Docker management platform with multi-host/Hawser support.
#
# Public-GitHub-safe:
# - No real secrets are stored in this file.
# - Runtime values come from /home/orik/docker/.env generated by Script 6.
# - Protected externally by Traefik + Authentik.
# - No direct host port is published in this base compose.
#
# Notes:
# - Dockhand listens on container port 3000.
# - Temporary direct access is added only by 15-dockhand-bootstrap-override.yml.
# - Dockhand docs recommend PUID/PGID plus Docker socket group access.

name: dockhand

services:
  dockhand:
    env_file:
      - /home/orik/docker/.env
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    group_add:
      - "${DOCKER_GID:-999}"

    networks:
      - t2_proxy

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      DATA_DIR: ${DOCKER_DIR}/appdata/dockhand

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DIR}/appdata/dockhand:${DOCKER_DIR}/appdata/dockhand
      - ${DOCKER_DIR}/compose:${DOCKER_DIR}/compose

    labels:
      traefik.enable: "true"

      traefik.http.routers.dockhand.rule: Host(`dockhand.${DOMAIN}`)
      traefik.http.routers.dockhand.entrypoints: https
      traefik.http.routers.dockhand.tls: "true"
      traefik.http.routers.dockhand.tls.certresolver: cloudflare
      traefik.http.routers.dockhand.middlewares: chain-authentik@file
      traefik.http.routers.dockhand.service: dockhand

      traefik.http.services.dockhand.loadbalancer.server.port: 3000

networks:
  t2_proxy:
    name: t2_proxy
    external: true
