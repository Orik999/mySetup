# 12-docker-gc-compose.yml
# Project: Docker GC
# Purpose: Optional safe periodic Docker cleanup through socket-proxy.
# Note: builder prune is intentionally omitted because socket-proxy BUILD is disabled.

name: docker-gc

services:
  docker-gc:
    image: docker:cli
    container_name: docker-gc
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - socket_proxy
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    entrypoint: /bin/sh
    command: >
      -c "while true; do
      echo 'Docker safe prune running...';
      docker container prune -f;
      docker image prune -f;
      sleep 604800;
      done"

networks:
  socket_proxy:
    name: socket_proxy
    external: true
