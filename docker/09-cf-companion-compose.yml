# 09-cf-companion-compose.yml
# Project: Traefik Cloudflare Companion
# Purpose: Automatically creates/updates Cloudflare records from Traefik Docker labels.
#
# Secret naming is aligned with script 6:
# - secret name: cf_api_token
# - secret file: ${CF_API_TOKEN_FILE}
# - container path: /run/secrets/cf_api_token

name: cf-companion

secrets:
  cf_api_token:
    file: ${CF_API_TOKEN_FILE}

services:
  cf-companion:
    image: tiredofit/traefik-cloudflare-companion:latest
    container_name: cf-companion
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - socket_proxy
    secrets:
      - cf_api_token
    environment:
      TIMEZONE: ${TZ}
      TRAEFIK_VERSION: 2
      ENABLE_TRAEFIK_POLL: "TRUE"
      TARGET_DOMAIN: ${DOMAIN}
      DOMAIN1: ${DOMAIN}
      DOMAIN1_ZONE_ID: ${CF_ZONE_ID}
      DOMAIN1_PROXIED: "true"
      DEFAULT_TTL: 1
      DOCKER_HOST: tcp://socket-proxy:2375
      CF_TOKEN__FILE: /run/secrets/cf_api_token

networks:
  socket_proxy:
    name: socket_proxy
    external: true
