# 11-filebrowser-compose.yml
# Project: Filebrowser
# Purpose: Browser file manager for uploads/downloads and safe project-file edits.
#
# Security note:
# - compose/shared/backups are mounted read-write so you can upload modified YAML/files.
# - secrets, .env, and database appdata are intentionally not mounted.
# - Large-upload Traefik middleware is applied for bigger uploads/downloads.

name: filebrowser

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - t2_proxy
    volumes:
      - ${DOCKER_DIR}/shared:/srv/shared
      - ${DOCKER_DIR}/backups:/srv/backups
      - ${DOCKER_DIR}/compose:/srv/compose
      - ${DOCKER_DIR}/appdata/traefik:/srv/traefik-config
      - ${DOCKER_DIR}/appdata/filebrowser/database:/database
      - ${DOCKER_DIR}/appdata/filebrowser/config:/config
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    labels:
      traefik.enable: "true"
      traefik.http.routers.filebrowser.rule: Host(`fb.${DOMAIN}`)
      traefik.http.routers.filebrowser.entrypoints: https
      traefik.http.routers.filebrowser.tls: "true"
      traefik.http.routers.filebrowser.tls.certresolver: cloudflare
      traefik.http.routers.filebrowser.middlewares: chain-authentik-large-upload@file
      traefik.http.routers.filebrowser.service: filebrowser
      traefik.http.services.filebrowser.loadbalancer.server.port: 80

networks:
  t2_proxy:
    name: t2_proxy
    external: true
