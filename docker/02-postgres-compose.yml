# 02-postgres-compose.yml
name: postgres

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    volumes:
      - ${DOCKER_DIR}/appdata/postgres/data:/var/lib/postgresql/data
      - ${DOCKER_DIR}/appdata/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: ${TZ}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTHENTIK_POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      POSTIZ_POSTGRES_PASSWORD: ${POSTIZ_POSTGRES_PASSWORD}
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  database:
    name: database
    driver: bridge